<ul class="h-full flex flex-col justify-start text-lg font-medium shadow-inner">
  @for (link of routes; track link[1]) {
    <li>
      <a
        routerLink="/dashboard/{{ link[1] }}"
        class="px-6 py-2 inline-block w-full transition-colors hover:bg-white/20"
        routerLinkActive="bg-white/10"
        (click)="closeSidebar()"
        >{{ link[0] }}</a
      >
    </li>
  }
</ul>
