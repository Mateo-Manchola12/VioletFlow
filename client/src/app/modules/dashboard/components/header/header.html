<div class="flex justify-between items-center pb-4">
  <button class="items-center text-xl hidden lg:flex">
    <i class="material-symbols-rounded w-6 h-6 m-auto">arrow_back</i>
    {{ title }}
  </button>

  <button
    type="button"
    class="lg:hidden p-2 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg shadow-lg bg-primary text-on-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-controls="hs-sidebar-offcanvas"
    aria-label="Toggle navigation"
    data-hs-overlay="#hs-sidebar-offcanvas"
  >
    <i class="material-symbols-rounded w-6 h-6">menu</i>
    <span class="sr-only">Abrir menú de navegación</span>
  </button>

  <div class="w-2/5 relative">
    <input
      type="search"
      placeholder="Buscar..."
      class="border-2 border-primary bg-primary/10 rounded-full py-2 px-4 w-full text-xs self-center font-normal peer"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
    />
    <i
      class="material-symbols-rounded absolute right-2 top-1/2 transform -translate-y-1/2 text-primary peer-focus:!hidden w-6 h-6"
    >
      search
    </i>
  </div>
  <button
    class="flex items-center justify-center h-10 w-10 rounded-full bg-primary text-on-primary"
  >
    <i class="material-symbols-rounded !text-4xl h-10 w-10 m-auto">
      account_circle
    </i>
  </button>
</div>
