<section aria-labelledby="final-title" class="animate-fade-in">
  <div class="flex flex-col gap-6 items-center text-center">
    <div
      class="size-16 bg-red-100 rounded-full flex items-center justify-center"
    >
      <i class="material-symbols-rounded text-red-600 text-3xl">error</i>
    </div>
    <h2 id="final-title" class="text-2xl font-bold text-red-600">
      ¡Registro fallido!
    </h2>
    <p class="text-gray-600 max-w-md">
      {{errorMessage ||
        'Tu cuenta no pudo ser creada. Por favor, verifica la información ingresada y vuelve a intentarlo.'
      }}
    </p>
  </div>
</section>
