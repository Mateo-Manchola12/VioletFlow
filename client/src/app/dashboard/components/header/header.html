<div class="flex justify-between items-center pb-4">
  <button class="flex items-center text-xl">
    <i class="material-icons w-6 h-6 m-auto">arrow_back</i> {{ title }}
  </button>
  <div class="w-2/5 relative">
    <input
      type="search"
      placeholder="Buscar..."
      class="border-2 border-primary bg-primary/10 rounded-full py-2 px-4 w-full text-xs self-center font-normal peer"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
    />
    <i
      class="material-icons absolute right-2 top-1/2 transform -translate-y-1/2 text-primary peer-focus:!hidden w-6 h-6"
    >
      search
    </i>
  </div>
  <button
    class="flex items-center justify-center h-10 w-10 rounded-full bg-primary text-on-primary"
  >
    <i class="material-icons-outlined !text-4xl h-10 w-10 m-auto"> account_circle </i>
  </button>
</div>
